<!DOCTYPE html>
<html lang="en">
 SHOPPING WEBSITE
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>MyShop - Online Store</title>
 <link rel="stylesheet" href="style.css">
 <style> 
    * { margin: 0; 
padding: 0; box-sizing: 
border-box;
}
body { font-family: Arial, 
sans-serif; background: 
#f5f5f5;
}
header { background: #222; 
color: white; padding: 20px 6%; 
display: flex; justify-content: 
space-between; align-items: 
center;
}
.logo { color: 
#00d4a0;
}
nav a { color: white; 
text-decoration: none; 
margin: 0 15px;
}

.cart-btn { 
background: #00d4a0; 
border: none; 
padding: 12px 18px; 
cursor: pointer; 
border-radius: 5px; 
font-weight: bold;
}
#cart-count { 
background: red; 
color: white; padding: 
4px 8px; border-radius: 50%;
}
.hero { text-align: 
center; padding: 
100px 20px; 
background: #222; 
color: white;
}
.hero h1 { font-size: 
40px; margin-bottom: 
15px;
}
 SHOPPING WEBSITE
.shop-btn { display: 
inline-block; 
background: #00d4a0; 
color: #222; padding: 
12px 25px; margin-top: 25px; text-decoration: none; 
border-radius: 5px;
}
.products { 
padding: 50px 6%;
}
.products h2 { text-align: center; margin-bottom: 30px;
}
.product-container { 
display: grid; grid-template-columns: repeat(auto-fit, 
minmax(220px, 1fr)); gap: 
25px;
}
 
.product { background: white; 
padding: 15px; border-radius: 
10px; text-align: center; 
box-shadow: 0 3px 10px #ddd;
}
.product img { 
width: 100%; 
height: 200px; 
object-fit: cover; 
border-radius: 8px;
}
.product h3 { 
margin: 15px 0;
}
.product p { margin-bottom: 15px; color: 
#00a77c; font-weight: 
bold;
}
.product button { 
background: #222; 
color: white; 
padding: 12px; 
border: none; 
width: 100%; cursor: 
 
pointer; border-radius: 5px;
}
.product button:hover { 
background: #00a77c;
}
/* Cart Sidebar */
.cart-sidebar { 
position: fixed; 
top: 0; right: -
400px; width: 
350px; max-width: 
100%; height: 
100%; background: 
white; z-index: 
1000; padding: 
20px; transition: 
0.4s; box-shadow: -
3px 0 10px #aaa; 
overflow-y: auto;
}
.cart-sidebar.active { 
right: 0;
}

.cart-header { display: flex; 
justify-content: space-between; 
margin-bottom: 25px;
}
.cart-header button { 
border: none; 
background: none; 
font-size: 22px; cursor: 
pointer;
}
.cart-item { display: flex; 
justify-content: space-between; 
align-items: center; gap: 10px; 
border-bottom: 1px solid #ddd; 
padding: 15px 0;
}
.cart-item button { 
padding: 5px 9px; cursor: 
pointer;
}
.cart-footer { margin-top: 25px;
 
}
.checkout-btn { 
    width: 100%; 
padding: 15px; 
background: #00a77c; 
color: white;
 border: none; 
 margin-top: 15px; 
 cursor: pointer; 
border-radius: 5px;
}
@media(max-width: 600px) {
 header { flex-wrap: wrap; 
gap: 15px;
 }
nav a { 
margin: 0 5px;
 }
 .hero h1 { font-size: 28px;
 }
}
 </style>
</head>
<body>
<header>
 <h2 class="logo">MyShop</h2>
 <nav>
 <a href="#">Home</a>
 <a href="#products">Products</a>
 </nav>
 <button class="cart-btn" onclick="toggleCart()">
 Cart
 <span id="cart-count">0</span>
 </button>
</header>
<section class="hero">
 <h1>Welcome to MyShop</h1>
 <p>Discover amazing products at affordable prices.</p>
 <a href="#products" class="shop-btn">Shop Now</a>
</section>

<section class="products" id="products">
 <h2>Our Products</h2>
 <div class="product-container" id="product-list">
    <div class="product 1" id="1">
        <img src="OIP.webp">
          <p>Smart Watch</p>
                <h1>price 450</h1>

    </div>
 </div>
</section>
<!-- Shopping Cart -->
<div class="cart-sidebar" id="cart-sidebar">
 <div class="cart-header">
 <h2>Shopping Cart</h2>
 <button onclick="toggleCart()">✕</button>
 </div>
 <div id="cart-items"></div>
 <div class="cart-footer">
 <h3>Total: R<span id="cart-total">0.00</span></h3>
 <button class="checkout-btn" onclick="checkout()">
 Checkout
 </button>
 </div>
</div>
<script src="script.js">
 
</script>
</body>
</html>
