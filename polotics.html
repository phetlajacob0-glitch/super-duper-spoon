<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily News</title>
    <style>
     *{
        margin:0;
        padding:0;
        box-sizing:border-box;
     }
     body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f4;
        color:#333;
        line-height: 1.6;
     }
     header{
        font-size: 36px;
        margin-bottom:5px;
     }
     nav{
        background-color: #e63946;
        display:flex;
        justify-content: center;
        flex-wrap:wrap;
        gap: 25px;
        padding:12px;
     }
     nav{
        color:white;
        text-decoration:none;
        font-weight:bold;
     }
     main{
        max-width: 1100px;
        margin: 25px auto;
        padding:0 20px;
     }
     .featured{
        background-color:white;
        margin-bottom: 35px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
     }
     .featured img{
        width: 100%;
        height: 350px;
        object-fit: cover;
        display: block;
     }
     .featured-text{
        padding:25px;
     }
     .featured-text h2{
        color:#14213d;
        margin-bottom:10px;
     }
     .featured-text
     .news-card{
        display:inline-block;
        color:#e63946;
        text-decoration:none;
        font-weight: bold;
        margin: 12px;
     }
     .featured-text
     .news-carda:hover{
        text-decoration: none;
     }
     .latest-news h2{
        margin-bottom:20px;
        color: #14213d;
     }
     .news-card{
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
        transition: 0.3s;
     }
     .news-card img{
        width: 100%;
        height:180px;
        object-fit: cover;
        display:block;
     }
     .card-content span{
        color: #e63946;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
     }
     .card-content h3{
        margin: 8px;
        color: #14213d;
     }
     footer{
        background-color: #14213d;
        color:white;
        text-align: center;
        padding:20px;
        margin-top:40px;
     }
     @media(max-width:768){
        .news-container{
            grid-template-columns: 1fr;
        }
        .featured img{
            height:220px;
        }
        header h1{
            font-size: 28px;
        }
        nav{
            gap: 15px;
        }
     }
       button{
      background-color: rgb(47, 47, 209);
      border-radius:  7px;
      
     }
     button a{
      text-decoration: none;
      color: white;
     font-size: 15px;
     }
    </style>
</head>

    </section>

</body>
</html>
